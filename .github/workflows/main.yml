name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create . --platforms=android

      - name: Add Android audio permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "READ_MEDIA_AUDIO" not in s:
              i = s.find(">", s.find("<manifest"))
              s = s[:i+1] + "\n<uses-permission android:name=" + chr(34) + "android.permission.READ_MEDIA_AUDIO" + chr(34) + "/>\n<uses-permission android:name=" + chr(34) + "android.permission.READ_EXTERNAL_STORAGE" + chr(34) + " android:maxSdkVersion=" + chr(34) + "32" + chr(34) + "/>" + s[i+1:]
              p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Fix legacy on_audio_query Android namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path.home() / ".pub-cache/hosted/pub.dev/on_audio_query_android-1.1.0/android/build.gradle"
          if not p.exists():
              raise SystemExit(f"Plugin file not found: {p}")
          s = p.read_text()
          if "namespace" not in s:
              s = s.replace("android {", 'android {\n    namespace "com.lucasjosino.on_audio_query"', 1)
              p.write_text(s)
          print("on_audio_query_android namespace fixed.")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-cinematic-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
